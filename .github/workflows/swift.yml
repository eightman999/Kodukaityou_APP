# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    # CocoaPods構成のため swift build は使用できない（Package.swift が無い）。
    # テストターゲットは雛形の空実装のみのため、ビルドまでを検証する正直なCIとする。
    - name: Install CocoaPods dependencies
      run: pod install
    - name: Build
      run: xcodebuild -workspace KOZUKAITYOU.xcworkspace -scheme KOZUKAITYOU -sdk iphonesimulator build
